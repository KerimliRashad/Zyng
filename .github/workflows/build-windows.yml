name: Build JeffTUN Clients

on:
  push:
    branches: [ claude/icq-messenger-b0bt2n ]
    paths:
      - 'qipcall_client/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  # ── WINDOWS (Python 3.8 — совместимость с Windows 7 / 8 / 8.1 / 10 / 11) ───
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'   # последняя версия Python с поддержкой Windows 7
      - name: Install deps
        # версии пакетов, ещё поддерживающие Python 3.8
        run: pip install "pyinstaller==6.6.0" "customtkinter==5.2.2" "pillow<11" "darkdetect"
      - name: Download xray-core (Windows 64-bit)
        shell: pwsh
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          Expand-Archive -Path xray.zip -DestinationPath xray_bin -Force
          Copy-Item xray_bin/xray.exe qipcall_client/xray.exe
      - name: Download sing-box (Windows 64-bit)
        shell: pwsh
        run: |
          $json = Invoke-RestMethod "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $asset = $json.assets | Where-Object { $_.name -match "windows-amd64.*\.zip$" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile sb.zip
          Expand-Archive -Path sb.zip -DestinationPath sb_bin -Force
          $exe = Get-ChildItem -Recurse sb_bin -Filter sing-box.exe | Select-Object -First 1
          Copy-Item $exe.FullName qipcall_client/sing-box.exe
      - name: Download flags
        shell: bash
        run: |
          mkdir -p qipcall_client/flags
          for cc in fr de fi us my nl ru gb pl se tr jp sg ca es it ua lv ee lt ch at hk kr in ae kz ge; do
            curl -sL "https://flagcdn.com/w80/$cc.png" -o "qipcall_client/flags/$cc.png" || true
          done
      - name: Build EXE
        shell: pwsh
        working-directory: qipcall_client
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "JeffTUN" `
            --icon "icon.ico" `
            --collect-all customtkinter `
            --add-binary "xray.exe;." `
            --add-binary "sing-box.exe;." `
            --add-data "logo_white.png;." `
            --add-data "orb_on.png;." `
            --add-data "orb_off.png;." `
            --add-data "icon.ico;." `
            --add-data "flags;flags" `
            qipcall.py
      - name: Publish release (jefftun)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jefftun
          name: JeffTUN VPN
          files: qipcall_client/dist/JeffTUN.exe
          body: |
            <h2 align="center">JeffTUN VPN 🦈</h2>
            <p align="center">Вставь ключ <code>vless:// · vmess:// · trojan:// · ss://</code> или ссылку-подписку — и нажми «Подключиться».</p>

            <table>
              <tr>
                <td><b>🪟 Windows</b></td>
                <td>
                  <a href="https://github.com/kerimlirashad/kerimlirashad/releases/download/jefftun/JeffTUN.exe"><img src="https://img.shields.io/badge/Setup-x64-2ea043?style=for-the-badge&logo=windows&logoColor=white"></a>
                  <a href="https://github.com/kerimlirashad/kerimlirashad/releases/download/jefftun/JeffTUN.exe"><img src="https://img.shields.io/badge/Setup-x64_(mirror)-1f6feb?style=for-the-badge"></a>
                </td>
              </tr>
              <tr>
                <td><b>📺 Android TV</b></td>
                <td>
                  <a href="https://github.com/Happ-proxy/happ-android/releases/latest"><img src="https://img.shields.io/badge/APK-sideload-2ea043?style=for-the-badge&logo=android&logoColor=white"></a>
                  <sub>вставь свой ключ / подписку JeffTUN в приложение</sub>
                </td>
              </tr>
              <tr>
                <td><b>🐧 Linux</b></td>
                <td>
                  <a href="https://github.com/kerimlirashad/kerimlirashad/releases/download/jefftun/JeffTUN-linux"><img src="https://img.shields.io/badge/Binary-x64-2ea043?style=for-the-badge&logo=linux&logoColor=white"></a>
                  <a href="https://github.com/kerimlirashad/kerimlirashad/releases/download/jefftun/JeffTUN-linux"><img src="https://img.shields.io/badge/Binary-x64_(mirror)-1f6feb?style=for-the-badge"></a>
                </td>
              </tr>
            </table>

            <blockquote>
            <b>⚠️ Windows ругается «SmartScreen защитил ваш компьютер»?</b><br>
            Это нормально для новых программ без платной подписи. Нажми
            <b>«Подробнее» → «Выполнить в любом случае»</b> — приложение безопасно.
            </blockquote>

            <p align="center"><sub>Linux: <code>chmod +x JeffTUN-linux</code> и запускай. Обновления ставятся внутри приложения.</sub></p>
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS убран: раннеры дорогие и держат очередь. Windows/Linux не зависят от него.

  # ── LINUX ────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pyinstaller customtkinter pillow
      - name: Download xray-core (Linux 64-bit)
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p xray_bin && unzip -o xray.zip -d xray_bin
          cp xray_bin/xray qipcall_client/xray
          chmod +x qipcall_client/xray
      - name: Download sing-box (Linux 64-bit)
        run: |
          url=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep browser_download_url | grep 'linux-amd64.tar.gz' | grep -v abi | head -1 | cut -d'"' -f4)
          curl -L -o sb.tar.gz "$url"
          mkdir -p sb_bin && tar -xzf sb.tar.gz -C sb_bin
          cp "$(find sb_bin -name sing-box -type f | head -1)" qipcall_client/sing-box
          chmod +x qipcall_client/sing-box
      - name: Download flags
        run: |
          mkdir -p qipcall_client/flags
          for cc in fr de fi us my nl ru gb pl se tr jp sg ca es it ua lv ee lt ch at hk kr in ae kz ge; do
            curl -sL "https://flagcdn.com/w80/$cc.png" -o "qipcall_client/flags/$cc.png" || true
          done
      - name: Build Linux binary
        working-directory: qipcall_client
        run: |
          pyinstaller --noconfirm --onefile \
            --name "JeffTUN-linux" \
            --collect-all customtkinter \
            --add-binary "xray:." \
            --add-binary "sing-box:." \
            --add-data "logo_white.png:." \
            --add-data "orb_on.png:." \
            --add-data "orb_off.png:." \
            --add-data "flags:flags" \
            qipcall.py
      - name: Publish release (jefftun)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jefftun
          name: JeffTUN VPN
          files: qipcall_client/dist/JeffTUN-linux
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
