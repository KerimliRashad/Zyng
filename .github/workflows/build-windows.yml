name: Build JeffTUN Clients

on:
  push:
    branches: [ claude/icq-messenger-b0bt2n ]
    paths:
      - 'qipcall_client/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  # ── WINDOWS ──────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Download xray-core (Windows 64-bit)
        shell: pwsh
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          Expand-Archive -Path xray.zip -DestinationPath xray_bin -Force
          Copy-Item xray_bin/xray.exe qipcall_client/xray.exe
      - name: Build EXE
        shell: pwsh
        working-directory: qipcall_client
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "JeffTUN" `
            --add-binary "xray.exe;." `
            qipcall.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeffTUN-Windows
          path: qipcall_client/dist/JeffTUN.exe
      - name: Publish release (Windows)
        if: github.ref == 'refs/heads/claude/icq-messenger-b0bt2n'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qipcall-latest
          name: JeffTUN VPN
          files: qipcall_client/dist/JeffTUN.exe
          body: |
            JeffTUN VPN — вставь ключ vless:// / vmess:// / trojan:// / ss://
            или ссылку-подписку и нажми «Подключиться».

            • Windows: JeffTUN.exe
            • Linux: JeffTUN-linux (chmod +x, затем запуск)
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── LINUX ────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pyinstaller
      - name: Download xray-core (Linux 64-bit)
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p xray_bin && unzip -o xray.zip -d xray_bin
          cp xray_bin/xray qipcall_client/xray
          chmod +x qipcall_client/xray
      - name: Build Linux binary
        working-directory: qipcall_client
        run: |
          pyinstaller --noconfirm --onefile \
            --name "JeffTUN-linux" \
            --add-binary "xray:." \
            qipcall.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeffTUN-Linux
          path: qipcall_client/dist/JeffTUN-linux
      - name: Publish release (Linux)
        if: github.ref == 'refs/heads/claude/icq-messenger-b0bt2n'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qipcall-latest
          name: JeffTUN VPN
          files: qipcall_client/dist/JeffTUN-linux
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS ────────────────────────────────────────────────────────────────
  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Download xray-core (macOS)
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-macos-64.zip
          mkdir -p xray_bin && unzip -o xray.zip -d xray_bin
          cp xray_bin/xray qipcall_client/xray
          chmod +x qipcall_client/xray
      - name: Build .app
        working-directory: qipcall_client
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name "JeffTUN" \
            --add-binary "xray:." \
            qipcall.py
      - name: Package .dmg
        working-directory: qipcall_client
        run: |
          mkdir -p dmg_root
          cp -R "dist/JeffTUN.app" dmg_root/ 2>/dev/null || cp dist/JeffTUN dmg_root/
          ln -s /Applications dmg_root/Applications || true
          hdiutil create -volname "JeffTUN VPN" -srcfolder dmg_root -ov -format UDZO dist/JeffTUN.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeffTUN-macOS
          path: qipcall_client/dist/JeffTUN.dmg
      - name: Publish release (macOS)
        if: github.ref == 'refs/heads/claude/icq-messenger-b0bt2n'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qipcall-latest
          name: JeffTUN VPN
          files: qipcall_client/dist/JeffTUN.dmg
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
