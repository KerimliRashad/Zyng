name: Build JeffTUN Clients

on:
  push:
    branches: [ claude/icq-messenger-b0bt2n ]
    paths:
      - 'qipcall_client/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  # ── WINDOWS ──────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Download xray-core (Windows 64-bit)
        shell: pwsh
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          Expand-Archive -Path xray.zip -DestinationPath xray_bin -Force
          Copy-Item xray_bin/xray.exe qipcall_client/xray.exe
      - name: Build EXE
        shell: pwsh
        working-directory: qipcall_client
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "JeffTUN" `
            --add-binary "xray.exe;." `
            qipcall.py
      - name: Clean old release assets
        shell: bash
        run: |
          for a in JeffTON.exe JeffTON-linux JeffTUN.dmg; do
            gh release delete-asset qipcall-latest "$a" -y || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qipcall-latest
          name: JeffTUN VPN
          files: qipcall_client/dist/JeffTUN.exe
          body: |
            JeffTUN VPN — вставь ключ vless:// / vmess:// / trojan:// / ss://
            или ссылку-подписку и нажми «Подключиться».

            • Windows: JeffTUN.exe
            • Linux: JeffTUN-linux (chmod +x, затем запуск)
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── LINUX ────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pyinstaller
      - name: Download xray-core (Linux 64-bit)
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p xray_bin && unzip -o xray.zip -d xray_bin
          cp xray_bin/xray qipcall_client/xray
          chmod +x qipcall_client/xray
      - name: Build Linux binary
        working-directory: qipcall_client
        run: |
          pyinstaller --noconfirm --onefile \
            --name "JeffTUN-linux" \
            --add-binary "xray:." \
            qipcall.py
      - name: Publish release (Linux)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qipcall-latest
          name: JeffTUN VPN
          files: qipcall_client/dist/JeffTUN-linux
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
