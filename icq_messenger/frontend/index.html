<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff Messenger</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- AUTH -->
<div id="auth-screen" class="screen hidden">
    <div class="auth-box">
        <div class="brand">
            <div class="brand-icon">J</div>
            <div class="brand-name">Jeff</div>
            <div class="brand-sub">Messenger</div>
        </div>

        <div class="tabs">
            <button class="tab active" id="tab-login" onclick="showTab('login')">Войти</button>
            <button class="tab" id="tab-reg" onclick="showTab('register')">Регистрация</button>
        </div>

        <div id="pane-login">
            <input class="field" type="text" id="l-user" placeholder="Логин" autocomplete="username">
            <input class="field" type="password" id="l-pass" placeholder="Пароль" autocomplete="current-password">
            <button class="btn" onclick="doLogin()">Войти</button>
            <div class="errmsg" id="l-err"></div>
        </div>

        <div id="pane-reg" style="display:none">
            <input class="field" type="text" id="r-user" placeholder="Логин" autocomplete="username">
            <input class="field" type="password" id="r-pass" placeholder="Пароль" autocomplete="new-password">
            <button class="btn" onclick="doRegister()">Создать аккаунт</button>
            <div class="errmsg" id="r-err"></div>
        </div>
    </div>
</div>

<!-- APP -->
<div id="app-screen" class="screen hidden">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sbar-head">
            <div class="me-info">
                <div class="avatar" id="me-av"></div>
                <div>
                    <div class="me-name" id="me-name"></div>
                    <div class="me-id" id="me-id"></div>
                </div>
            </div>
            <div style="display:flex;gap:6px">
                <button class="ico-btn" title="Добавить" onclick="openAddModal()">＋</button>
                <button class="ico-btn" title="Выйти" onclick="doLogout()">⏻</button>
            </div>
        </div>

        <div class="stabs">
            <button class="stab active" id="stab-contacts" onclick="showSide('contacts')">Контакты</button>
            <button class="stab" id="stab-chats" onclick="showSide('chats')">Чаты</button>
        </div>

        <div id="panel-contacts" class="panel">
            <div class="search-wrap">
                <input class="search-field" id="q-contact" placeholder="Поиск..." oninput="onSearchContacts()">
            </div>
            <div id="search-res"></div>
            <div id="pending-list"></div>
            <div id="friends-list"></div>
        </div>

        <div id="panel-chats" class="panel" style="display:none">
            <div id="chats-list"></div>
        </div>
    </div>

    <!-- Chat -->
    <div class="chat-area">
        <div id="no-chat" class="no-chat">
            <div class="brand-icon big">J</div>
            <p>Выберите чат</p>
        </div>

        <div id="chat-view" style="display:none;flex-direction:column;height:100%">
            <div class="chat-head">
                <div class="avatar" id="ch-av"></div>
                <div>
                    <div class="ch-name" id="ch-name"></div>
                    <div class="ch-status" id="ch-status"></div>
                </div>
            </div>

            <div class="msgs" id="msgs">
                <div id="msg-list"></div>
                <div id="typing" class="typing hidden"><span></span><span></span><span></span></div>
            </div>

            <div class="inp-area">
                <textarea id="msg-inp" placeholder="Сообщение..." rows="1"
                    onkeydown="onKey(event)" oninput="onType()"></textarea>
                <button class="send-btn" onclick="sendMsg()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Add Contact Modal -->
<div id="add-modal" class="overlay hidden" onclick="closeModal(event)">
    <div class="modal-box">
        <h3>Найти пользователя</h3>
        <input class="field" id="modal-q" placeholder="Введите логин..." oninput="onSearchModal()">
        <div id="modal-res"></div>
        <button class="btn-sec" onclick="closeModal()">Закрыть</button>
    </div>
</div>

<div id="notif" class="notif hidden"></div>

<script src="/js/app.js"></script>
</body>
</html>
