<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jeff Messenger</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- AUTH -->
<div id="auth-screen" class="screen hidden">
  <div class="auth-box">
    <div class="brand">
      <div class="brand-icon">J</div>
      <div class="brand-name">Jeff</div>
      <div class="brand-sub">MESSENGER</div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="showTab('login')">Войти</button>
      <button class="tab" id="tab-reg" onclick="showTab('register')">Регистрация</button>
    </div>
    <div id="pane-login">
      <input class="field" type="text" id="l-user" placeholder="Логин" autocomplete="username">
      <input class="field" type="password" id="l-pass" placeholder="Пароль" autocomplete="current-password">
      <button class="btn" onclick="doLogin()">Войти</button>
      <div class="errmsg" id="l-err"></div>
    </div>
    <div id="pane-reg" style="display:none">
      <input class="field" type="text" id="r-user" placeholder="Логин (мин. 3 символа)" autocomplete="username">
      <input class="field" type="password" id="r-pass" placeholder="Пароль (мин. 4 символа)" autocomplete="new-password">
      <button class="btn" onclick="doRegister()">Создать аккаунт</button>
      <div class="errmsg" id="r-err"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-screen" class="screen hidden">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sbar-head">
      <button class="ico-btn burger" id="burger-btn" onclick="goBack()" style="display:none">☰</button>
      <div class="me-info">
        <div class="avatar sm" id="me-av"></div>
        <div style="min-width:0">
          <div class="me-name" id="me-name"></div>
          <div class="me-id" id="me-id"></div>
        </div>
      </div>
      <div style="display:flex;gap:2px;flex-shrink:0">
        <button class="ico-btn" title="Найти пользователя" onclick="openAddModal()">✏️</button>
        <button class="ico-btn" title="Новая группа/канал" onclick="openGroupModal()">👥</button>
        <button class="ico-btn" title="Выйти" onclick="doLogout()">⚙️</button>
      </div>
    </div>

    <div class="sb-search">
      <div class="search-wrap">
        <input class="search-field" id="q-contact" placeholder="Поиск..." oninput="onSearchContacts()">
      </div>
    </div>

    <div class="stabs">
      <button class="stab active" id="stab-contacts" onclick="showSide('contacts')">Контакты</button>
      <button class="stab" id="stab-chats" onclick="showSide('chats')">Чаты</button>
    </div>

    <div id="panel-contacts" class="panel">
      <div id="search-res"></div>
      <div id="pending-list"></div>
      <div id="friends-list"></div>
    </div>

    <div id="panel-chats" class="panel" style="display:none">
      <div id="chats-list"></div>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chat-area">
    <div id="no-chat" class="no-chat">
      <div class="brand-icon big">J</div>
      <p>Выберите чат чтобы начать общение</p>
    </div>

    <div id="chat-view">
      <div class="chat-head">
        <button class="back-btn" id="back-btn" onclick="goBack()">‹</button>
        <div class="avatar" id="ch-av"></div>
        <div class="ch-info">
          <div class="ch-name" id="ch-name"></div>
          <div class="ch-status" id="ch-status"></div>
        </div>
        <div class="chat-head-actions">
          <button class="ico-btn" id="btn-voice-call" title="Голосовой звонок" onclick="startCall('voice')" style="display:none">📞</button>
          <button class="ico-btn" id="btn-video-call" title="Видеозвонок" onclick="startCall('video')" style="display:none">📹</button>
          <button class="ico-btn" title="Участники" onclick="toggleMembersPanel()" id="btn-members" style="display:none">👤</button>
        </div>
      </div>

      <div style="display:flex;flex:1;overflow:hidden">
        <div style="display:flex;flex-direction:column;flex:1;overflow:hidden;position:relative">
          <div class="msgs" id="msgs">
            <div id="msg-list"></div>
            <div id="typing" class="typing hidden"><span></span><span></span><span></span></div>
          </div>

          <div id="emoji-picker" class="emoji-picker hidden"></div>

          <div id="file-preview" class="file-preview hidden">
            <span>📎</span>
            <span id="file-preview-name" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
            <button onclick="clearFile()">✕</button>
          </div>

          <div class="inp-area">
            <button class="tool-btn" onclick="toggleEmoji()" title="Эмодзи">😊</button>
            <label class="tool-btn" title="Прикрепить файл" style="cursor:pointer">
              📎<input type="file" id="file-inp" style="display:none" onchange="handleFile(event)">
            </label>
            <button class="tool-btn" id="voice-rec-btn" title="Голосовое сообщение" onclick="toggleVoiceRec()">🎤</button>
            <textarea id="msg-inp" placeholder="Сообщение..." rows="1"
              onkeydown="onKey(event)" oninput="onType()"></textarea>
            <button class="send-btn" onclick="sendMsg()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13" stroke="white" stroke-width="2.3" stroke-linecap="round"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2.3" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="members-panel" class="hidden">
          <div class="mp-head">
            <span>Участники</span>
            <button class="ico-btn" style="width:28px;height:28px;font-size:13px" onclick="toggleMembersPanel()">✕</button>
          </div>
          <div class="mp-list" id="mp-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Contact Modal -->
<div id="add-modal" class="overlay hidden" onclick="onOverlayClick(event,'add-modal')">
  <div class="modal-box">
    <h3>Найти пользователя</h3>
    <input class="field" id="modal-q" placeholder="Логин или ID..." oninput="onSearchModal()">
    <div id="modal-res"></div>
    <button class="btn-sec" onclick="closeModalById('add-modal')">Закрыть</button>
  </div>
</div>

<!-- Create Group/Channel Modal -->
<div id="group-modal" class="overlay hidden" onclick="onOverlayClick(event,'group-modal')">
  <div class="modal-box">
    <h3>Новая группа / канал</h3>
    <input class="field" id="gm-name" placeholder="Название">
    <input class="field" id="gm-desc" placeholder="Описание (необязательно)">
    <label style="display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="gm-ischannel" style="width:18px;height:18px;accent-color:var(--acc)">
      <span style="font-size:14px">Канал (только владелец пишет)</span>
    </label>
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Добавить участников:</div>
    <div class="member-list-modal" id="gm-friends"></div>
    <button class="btn" onclick="doCreateGroup()" style="margin-top:12px">Создать</button>
    <button class="btn-sec" onclick="closeModalById('group-modal')">Отмена</button>
    <div class="errmsg" id="gm-err"></div>
  </div>
</div>

<!-- Call overlay -->
<div id="call-overlay" class="hidden">
  <div id="call-video-wrap">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
  </div>
  <div class="call-avatar" id="call-av"></div>
  <div class="call-name" id="call-name"></div>
  <div class="call-status" id="call-status">Вызов...</div>
  <div class="call-actions" id="call-actions"></div>
</div>

<div id="notif" class="notif hidden"></div>

<script src="/js/app.js"></script>
</body>
</html>
