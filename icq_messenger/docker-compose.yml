services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: icq
      POSTGRES_PASSWORD: icqpass
      POSTGRES_DB: icqdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icq -d icqdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://icq:icqpass@db:5432/icqdb
      SECRET_KEY: ${SECRET_KEY:-jeff-messenger-secret-2026}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_data:/etc/nginx/ssl
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web
    command: >-
      sh -c "apk add --no-cache openssl &&
      mkdir -p /etc/nginx/ssl /var/www/certbot &&
      if [ -f /etc/letsencrypt/live/qipcall.duckdns.org/fullchain.pem ]; then
      cp -fL /etc/letsencrypt/live/qipcall.duckdns.org/fullchain.pem /etc/nginx/ssl/cert.pem &&
      cp -fL /etc/letsencrypt/live/qipcall.duckdns.org/privkey.pem /etc/nginx/ssl/key.pem;
      else
      [ -f /etc/nginx/ssl/cert.pem ] || openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout /etc/nginx/ssl/key.pem -out /etc/nginx/ssl/cert.pem -subj '/CN=jeff-messenger/O=Jeff/C=RU';
      fi &&
      nginx -g 'daemon off;'"

volumes:
  pg_data:
  uploads:
  ssl_data:
  certbot_conf:
  certbot_www:
